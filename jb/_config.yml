# Book settings
title: Astronomical Data in Python
author: Allen B. Downey

execute:
  # Running the notebooks queries the Gaia archive, which is slow and sometimes
  # times out, so the site uses the outputs saved in soln/
  execute_notebooks: 'off'

repository:
  url: https://github.com/AllenDowney/AstronomicalData
  branch: main

html:
  baseurl: https://allendowney.github.io/AstronomicalData/
  use_repository_button: true
  # Page-view counter: one request per page view to greenteapress.com/gh.gif,
  # counted from the greenteapress.com access logs (GreenTeaPress scripts/log_report.py).
  # No cookies, no third party.
  extra_footer: |
    <script>new Image().src="https://greenteapress.com/gh.gif?u="+encodeURIComponent(location.href)+"&r="+encodeURIComponent(document.referrer)</script>

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath

sphinx:
  extra_extensions:
    - sphinx_sitemap
    - sphinxext.opengraph
  config:
    html_baseurl: https://allendowney.github.io/AstronomicalData/
    sitemap_url_scheme: "{link}"
    sitemap_excludes: [genindex.html, search.html]
    ogp_site_url: https://allendowney.github.io/AstronomicalData/
    ogp_site_name: Astronomical Data in Python
    # the opening text is often boilerplate, so write meta descriptions per page instead
    ogp_enable_meta_description: false
